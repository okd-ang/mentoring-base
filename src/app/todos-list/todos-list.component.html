<div class="todos-list-container">
  <app-create-todo-form
    (createTodo)="createTodo($event)"
  ></app-create-todo-form>
  <div class="todos-list-title">КОМПОНЕНТ СПИСКА ЗАДАЧА</div>
  <div class="todos-list">
    <div *ngFor="let todo of todos$ | async">
      <app-todo-card
        [todo]="todo"
        (deleteTodo)="deleteTodo($event)"
        (editTodo)="editTodo($event)"
      ></app-todo-card>
    </div>
  </div>
</div>
