<h2>ПОЛЬЗОВАТЕЛЬ: {{ data.user.name }}</h2>

<form class="form-group" [formGroup]="form">
  <mat-form-field>
    <mat-label>Имя пользователя</mat-label>
    <input matInput formControlName="name" />
    <mat-error>Исправьте имя пользователя</mat-error>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Введите вашу почту</mat-label>
    <input matInput formControlName="email" />
    <mat-error>Исправьте адрес почты</mat-error>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Номер телефона</mat-label>
    <input matInput formControlName="phone" />
    <mat-error>Исправьте номер телефона</mat-error>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Адрес сайта</mat-label>
    <input matInput formControlName="website" />
    <mat-error>Исправьте адрес сайта</mat-error>
  </mat-form-field>

  <mat-form-field formGroupName="company">
    <mat-label>Имя компании</mat-label>
    <input matInput formControlName="name" />
    <mat-error>Исправьте имя компании</mat-error>
  </mat-form-field>

  <button
    class="btn-formgroup"
    mat-raised-button
    [mat-dialog-close]="userWithUpdatedFields"
    type="submit"
    [disabled]="form.invalid"
  >
    <mat-icon>person add</mat-icon>
    РЕДАКТИРОВАТЬ ПОЛЬЗОВАТЕЛЯ
  </button>
</form>
